name: Validate skill

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frontmatter
        run: python scripts/ci/validate_frontmatter.py .
      - name: Validate links
        run: python scripts/ci/validate_links.py .
      - name: Check script syntax
        run: bash -n scripts/install-design-skill.sh scripts/ci/*.sh 2>/dev/null || true
