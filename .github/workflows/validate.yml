name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontmatter
        run: python3 scripts/ci/validate_frontmatter.py .
      - name: Validate links
        run: python3 scripts/ci/validate_links.py .
